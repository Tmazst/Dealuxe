<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spectator Bracket View</title>
    <style>
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #050815; color: #eef2ff; }
      .page { max-width: 1280px; margin: auto; padding: 2rem; }
      .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
      .header h1 { margin: 0; font-size: 2rem; }
      .status { color: #99a7d4; }
      .bracket { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; }
      .round { min-width: 260px; display: grid; gap: 1rem; }
      .round h2 { margin: 0; font-size: 1rem; color: #cad4ff; }
      .match { background: rgba(255,255,255,0.05); border: 1px solid rgba(106,139,255,0.18); border-radius: 18px; padding: 1rem; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
      .match span { display: block; font-size: 0.95rem; margin-bottom: 0.55rem; }
      .match strong { font-size: 1.05rem; display: block; margin-bottom: 0.65rem; }
      .match .result { color: #a7b3da; font-size: 0.92rem; }
      .aside { display: grid; gap: 1rem; min-width: 320px; }
      .panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 1.3rem; }
      .panel h3 { margin-top: 0; color: #d7e5ff; }
      .panel p { margin: 0.65rem 0 0; line-height: 1.6; color: #b3c3dc; }
      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { padding: 0.8rem 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .table th { text-align: left; color: #9eb6e3; font-size: 0.95rem; }
      .watch-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; }
      .watch-actions a { padding:10px; border:1px solid #ffe46b; border-radius:8px; color:#ffe46b; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div>
          <h1>Bracket Flow</h1>
          <div class="status" id="tournament-status">Loading tournament data…</div>
        </div>
        <a href="/spectators/tournaments">Back to center</a>
      </div>
      <div class="bracket" id="bracket-container"></div>
      <div class="aside">
        <div class="panel">
          <h3>Current overview</h3>
          <div id="overview-details"><p>Loading bracket details…</p></div>
        </div>
        <div class="panel">
          <h3>Match winners</h3>
          <table class="table" id="winner-table"><thead><tr><th>Match</th><th>Winner</th></tr></thead><tbody></tbody></table>
        </div>
      </div>
    </div>
    <script>
      const tournamentId = Number(window.location.pathname.split('/').filter(Boolean)[2]);
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      async function loadBracket() {
        const res = await fetch(`/api/tournaments/${tournamentId}/overview`);
        const data = await res.json();
        const overview = data.tournament;
        document.getElementById('tournament-status').textContent = `${overview.tournament_name} · ${overview.status.replace('_', ' ')}`;

        const bracketContainer = document.getElementById('bracket-container');
        bracketContainer.innerHTML = '';
        const rounds = data.rounds || [];
        if (!rounds.length) {
          bracketContainer.innerHTML = '<div style="color:#9aa7c5">Bracket is not ready yet.</div>';
          return;
        }

        rounds.forEach(round => {
          const roundEl = document.createElement('div');
          roundEl.className = 'round';
          roundEl.innerHTML = `<h2>${escapeHtml(round.round_name)}</h2>`;
          round.matches.forEach(match => {
            const matchEl = document.createElement('div');
            matchEl.className = 'match';
            matchEl.innerHTML = `
              <strong>${escapeHtml(match.player1_name || 'TBD')} vs ${escapeHtml(match.player2_name || 'TBD')}</strong>
              <span>Status: ${match.status}</span>
              <span class="result">${match.winner_name ? `Winner: ${escapeHtml(match.winner_name)}` : 'Winner: pending'}</span>
            `;
            const liveMatch = data.matches.find(item => item.id === match.match_id);
            if (liveMatch?.watch_url && liveMatch.status === 'in_progress') {
              const actions = document.createElement('div'); actions.className = 'watch-actions';
              const live = document.createElement('span'); live.textContent = '● Live game';
              const link = document.createElement('a'); link.textContent = '◉ Watch game'; link.href = liveMatch.watch_url;
              actions.append(live, link); matchEl.append(actions);
            }
            roundEl.appendChild(matchEl);
          });
          bracketContainer.appendChild(roundEl);
        });

        const details = document.getElementById('overview-details');
        details.innerHTML = `
          <p><strong>Type:</strong> ${overview.tournament_type}</p>
          <p><strong>Matches:</strong> ${data.stats.completed_matches}/${data.stats.total_matches} completed</p>
          <p><strong>Players:</strong> ${data.stats.participant_count}</p>
        `;

        const winnerTable = document.getElementById('winner-table').querySelector('tbody');
        winnerTable.innerHTML = '';
        data.rounds.flatMap(r => r.matches).filter(m => m.winner_name).forEach(match => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${escapeHtml(match.player1_name || 'TBD')} vs ${escapeHtml(match.player2_name || 'TBD')}</td><td>${escapeHtml(match.winner_name)}</td>`;
          winnerTable.appendChild(row);
        });
      }
      loadBracket();
      setInterval(() => { if (!document.hidden) loadBracket().catch(() => {}); }, 15000);
    </script>
  </body>
</html>
