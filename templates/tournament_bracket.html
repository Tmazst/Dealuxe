<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Bracket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .bracket-container {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            padding: 40px 20px;
            overflow-x: auto;
        }

        .bracket-header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 100%;
        }

        .bracket-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 15px 0;
        }

        .bracket-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 20px auto 30px;
        }

        .info-card {
            background: var(--glass-strong);
            border: 1px solid var(--accent-1);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .info-label {
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            color: var(--accent-2);
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* Main Bracket Visualization */
        .bracket-wrapper {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 40px;
            max-width: 100%;
            margin: 0 auto;
            overflow-x: auto;
        }

        .bracket-column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 250px;
            gap: 20px;
        }

        .bracket-title {
            text-align: center;
            color: var(--accent-1);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent-1);
        }

        /* Match Box */
        .match-box {
            background: var(--card-bg);
            border: 2px solid var(--glass-strong);
            border-radius: 10px;
            padding: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            animation: matchAppear 0.4s ease;
        }

        @keyframes matchAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .match-box:hover {
            border-color: var(--accent-1);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.3);
            transform: translateY(-5px);
        }

        .match-box.completed {
            border-color: var(--success);
            background: linear-gradient(135deg, rgba(62, 230, 181, 0.1), rgba(62, 230, 181, 0.05));
        }

        .match-header {
            background: var(--glass);
            padding: 10px 15px;
            border-bottom: 1px solid var(--glass-strong);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-round {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-time {
            font-size: 0.75rem;
            color: var(--accent-2);
            font-weight: 600;
        }

        .match-players {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px;
        }

        .player-slot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        .player-slot:first-child {
            margin-bottom: 5px;
        }

        .player-slot.winner {
            background: rgba(62, 230, 181, 0.2);
            border: 1px solid var(--success);
        }

        .player-slot.empty {
            background: var(--glass-strong);
            color: var(--muted);
            opacity: 0.5;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .player-name {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-score {
            color: var(--accent-2);
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 40px;
            text-align: right;
        }

        .match-status {
            padding: 8px;
            background: var(--glass-strong);
            border-top: 1px solid var(--glass-strong);
            text-align: center;
            font-size: 0.8rem;
            color: var(--accent-1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .status-live {
            color: #ef4444;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-pending {
            color: var(--muted);
        }

        .status-completed {
            color: var(--success);
        }

        .status-rolling {
            color: var(--accent-2);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .roll-countdown {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        /* Bracket Connector Lines (optional SVG) */
        .bracket-connector {
            position: absolute;
            pointer-events: none;
        }

        /* Medal Section - Finals Results */
        .finals-section {
            margin-top: 60px;
            padding: 40px;
            background: var(--glass);
            border: 2px solid var(--accent-1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .finals-title {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent-1);
            margin: 0 0 40px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .medals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .medal-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            animation: medalAppear 0.5s ease;
        }

        @keyframes medalAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .medal-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3);
        }

        .medal-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .medal-placement {
            font-size: 1.2rem;
            color: var(--accent-1);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .medal-player {
            font-size: 1.2rem;
            color: white;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .medal-prize {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: var(--bg-1);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Controls */
        .bracket-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .next-match-panel {
            display: none;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 28px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(139,92,246,.18), rgba(59,130,246,.12));
            border: 1px solid rgba(139,92,246,.45);
            border-radius: 14px;
        }

        .next-match-icon {
            font-size: 2rem;
        }

        .next-match-body {
            flex: 1;
        }

        .next-match-label {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-2);
            margin-bottom: 4px;
        }

        .next-match-detail {
            font-size: 1rem;
            color: white;
            font-weight: 600;
        }

        .next-match-actions a,
        .next-match-actions button {
            white-space: nowrap;
        }

        .btn-bracket {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .btn-back {
            background: var(--glass-strong);
            border: 2px solid var(--accent-1);
            color: var(--accent-1);
        }

        .btn-back:hover {
            background: var(--accent-1);
            color: white;
            transform: translateY(-3px);
        }

        .btn-share {
            background: linear-gradient(135deg, var(--accent-1), #7c3aed);
            color: white;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .btn-share:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.5);
        }

        /* Live Match Indicator */
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .bracket-wrapper {
                gap: 20px;
                padding: 20px;
            }

            .bracket-column {
                min-width: 200px;
                gap: 15px;
            }

            .match-box {
                min-height: 120px;
            }

            .player-name {
                font-size: 0.8rem;
            }

            .medals-grid {
                grid-template-columns: 1fr;
            }

            .bracket-header h1 {
                font-size: 1.5rem;
            }

            .finals-section {
                padding: 20px;
            }

            .bracket-info {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: var(--accent-1);
            color: white;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="bracket-container">
        <!-- Header -->
        <div class="bracket-header">
            <h1>🏆 TOURNAMENT BRACKET</h1>
            <p id="tournament-name" style="color: var(--muted); margin: 10px 0;">Tournament Name</p>
        </div>

        <!-- Info Cards -->
        <div class="bracket-info">
            <div class="info-card">
                <div class="info-label">Round</div>
                <div class="info-value" id="current-round">QUARTER FINALS</div>
            </div>
            <div class="info-card">
                <div class="info-label">Matches Today</div>
                <div class="info-value" id="today-matches">4</div>
            </div>
            <div class="info-card">
                <div class="info-label">Live Now</div>
                <div class="info-value" id="live-count">1</div>
            </div>
            <div class="info-card">
                <div class="info-label">Completed</div>
                <div class="info-value" id="completed-count">2</div>
            </div>
        </div>

        <!-- Your next match callout (direct link into the multiplayer game UI) -->
        <div class="next-match-panel" id="next-match-panel" style="display:none;">
            <div class="next-match-icon">🎯</div>
            <div class="next-match-body">
                <div class="next-match-label">Your next match</div>
                <div class="next-match-detail" id="next-match-detail">Loading...</div>
            </div>
            <div class="next-match-actions" id="next-match-actions"></div>
        </div>

        <!-- Bracket Visualization -->
        <div class="bracket-wrapper" id="bracket-wrapper">
            <!-- Bracket will be generated by JavaScript -->
        </div>

        <!-- Finals Results (shown when tournament complete) -->
        <div class="finals-section" id="finals-section" style="display: none;">
            <div class="finals-title">🎊 Tournament Results</div>
            <div class="medals-grid">
                <div class="medal-card">
                    <div class="medal-icon">🥇</div>
                    <div class="medal-placement">1st Place</div>
                    <div class="medal-player" id="winner-name">---</div>
                    <div class="medal-prize" id="winner-prize">E0</div>
                </div>
                <div class="medal-card">
                    <div class="medal-icon">🥈</div>
                    <div class="medal-placement">2nd Place</div>
                    <div class="medal-player" id="runner-up-name">---</div>
                    <div class="medal-prize" id="runner-up-prize">E0</div>
                </div>
                <div class="medal-card">
                    <div class="medal-icon">🥉</div>
                    <div class="medal-placement">3rd Place</div>
                    <div class="medal-player" id="third-place-name">---</div>
                    <div class="medal-prize" id="third-place-prize">E0</div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bracket-controls">
            <button class="btn-bracket btn-back" onclick="goBack()">
                ← Back to Tournaments
            </button>
            <button class="btn-bracket btn-share" onclick="shareResults()">
                📤 Share Results
            </button>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const socket = io({
            transports: ['websocket', 'polling']
        });

        let tournamentData = {};
        const tournamentCode = '{{ tournament_code }}';
        const currentUserId = {{ current_user_id|tojson }};

        socket.on('connect', () => {
            console.log('✅ Connected to bracket viewer');
            if (tournamentCode && tournamentCode !== 'None') {
                socket.emit('join_bracket_room', { tournament_code: tournamentCode });
            }
            loadBracketData();
        });

        socket.on('tournament_updated', (data) => {
            console.log('🔄 Bracket updated:', data);
            loadBracketData();
        });

        socket.on('match_complete', (data) => {
            console.log('✅ Match completed:', data);
            loadBracketData();
            showNotification(`${data.winner_name || 'Match'} completed! 🎉`);
        });

        socket.on('tournament_match_started', (data) => {
            console.log('🎮 Tournament match started:', data);
            loadBracketData();
            if (data.room_code) {
                showNotification('Your match is starting! Redirecting...');
                setTimeout(() => {
                    window.location.href = `/game/${data.room_code}`;
                }, 1000);
            }
        });

        socket.on('match_roll_started', (data) => {
            console.log('🎲 Roll started:', data);
            loadBracketData();
            if (data.message) showNotification(data.message);
        });

        socket.on('match_roll_cancelled', (data) => {
            console.log('🔄 Roll cancelled:', data);
            loadBracketData();
            if (data.message) showNotification(data.message);
        });

        socket.on('match_roll_resolved', (data) => {
            console.log('🏁 Roll resolved:', data);
            loadBracketData();
            if (data.message) showNotification(data.message);
        });

        socket.on('tournament_schedule_fallback', (data) => {
            if (data.message) showNotification(data.message);
        });

        function startMatch(matchId) {
            const tId = '{{ tournament_id }}';
            fetch(`/api/tournaments/${tId}/matches/${matchId}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.room_code) {
                    window.location.href = `/game/${data.room_code}`;
                } else if (data.error) {
                    showNotification(data.error);
                }
            })
            .catch(err => {
                showNotification('Failed to start match');
            });
        }

        function rollMatch(matchId) {
            const tId = '{{ tournament_id }}';
            fetch(`/api/tournaments/${tId}/matches/${matchId}/roll`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    showNotification(data.error);
                    return;
                }
                showNotification(data.message || 'Roll started');
                loadBracketData();
            })
            .catch(err => {
                showNotification('Failed to roll the game');
            });
        }

        function loadBracketData() {
            const tId = '{{ tournament_id }}';
            // NOTE: after Jinja renders this page `{{ tournament_id }}` becomes a
            // real id (e.g. "1"), so a condition like `tId !== '{{ tournament_id }}'`
            // would ALWAYS be false and real data would never load. Just check the id.
            if (tId && tId !== 'None') {
                fetch(`/api/tournaments/${tId}/overview`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.tournament) {
                            tournamentData = data;
                            renderBracket();
                        } else {
                            renderBracket();
                        }
                    })
                    .catch(() => renderBracket());
            } else {
                renderBracket();
            }
        }

        function renderBracket() {
            if (tournamentData && tournamentData.tournament && Array.isArray(tournamentData.rounds)) {
                renderLiveBracket();
                return;
            }
            const wrapper = document.getElementById('bracket-wrapper');
            
            // Example 4-player bracket structure
            wrapper.innerHTML = `
                <div class="bracket-column">
                    <div class="bracket-title">SEMI-FINALS</div>
                    
                    <div class="match-box completed">
                        <div class="match-header">
                            <span class="match-round">SF - Match 1</span>
                            <span class="match-time">Completed</span>
                        </div>
                        <div class="match-players">
                            <div class='win-type'>Escape Win</div>
                            <div class="player-slot winner">
                                <div class="player-info">
                                    <div class="player-avatar">A</div>
                                    <div class="player-name">Alice</div>
                                </div>
                                <div class="player-score">2</div>
                            </div>
                            <div class="player-slot">
                                <div class="player-info">
                                    <div class="player-avatar">B</div>
                                    <div class="player-name">Bob</div>
                                </div>
                                <div class="player-score">0</div>
                            </div>
                        </div>
                        <div class="match-status status-completed">✅ Completed</div>
                    </div>

                    <div class="match-box completed">
                        <div class="match-header">
                            <span class="match-round">SF - Match 2</span>
                            <span class="match-time">Completed</span>
                        </div>
                        <div class="match-players">
                            <div class="player-slot winner">
                                <div class='win-type'>Crazy Escape Win</div>
                                <div class="player-info">
                                    <div class="player-avatar">C</div>
                                    <div class="player-name">Charlie</div>
                                </div>
                                <div class="player-score">2</div>
                            </div>
                            <div class="player-slot">
                                <div class="player-info">
                                    <div class="player-avatar">D</div>
                                    <div class="player-name">Diana</div>
                                </div>
                                <div class="player-score">1</div>
                            </div>
                        </div>
                        <div class="match-status status-completed">✅ Completed</div>
                    </div>
                </div>

                <div class="bracket-column">
                    <div class="bracket-title">FINALS</div>
                    
                    <div class="match-box">
                        <div class="match-header">
                            <span class="match-round">FINAL</span>
                            <span class="live-indicator">
                                <span class="live-dot"></span>
                                LIVE
                            </span>
                        </div>
                        <div class="match-players">
                            <div class="player-slot">
                                <div class="player-info">
                                    <div class="player-avatar">A</div>
                                    <div class="player-name">Alice</div>
                                </div>
                                <div class="player-score">1</div>
                            </div>
                            <div class="player-slot">
                                <div class="player-info">
                                    <div class="player-avatar">C</div>
                                    <div class="player-name">Charlie</div>
                                </div>
                                <div class="player-score">1</div>
                            </div>
                        </div>
                        <div class="match-status status-live">🔴 LIVE NOW</div>
                    </div>
                </div>

                <div class="bracket-column">
                    <div class="bracket-title">3RD PLACE</div>
                    
                    <div class="match-box">
                        <div class="match-header">
                            <span class="match-round">3RD PLACE</span>
                            <span class="match-time">Pending</span>
                        </div>
                        <div class="match-players">
                            <div class="player-slot winner">
                                <div class='win-type'>Dealuxe Win</div>
                                <div class="player-info">
                                    <div class="player-avatar">B</div>
                                    <div class="player-name">Bob</div>
                                </div>
                                <div class="player-score">2</div>
                            </div>
                            <div class="player-slot">
                                <div class="player-info">
                                    <div class="player-avatar">D</div>
                                    <div class="player-name">Diana</div>
                                </div>
                                <div class="player-score">1</div>
                            </div>
                        </div>
                        <div class="match-status status-completed">✅ Completed</div>
                    </div>
                </div>
            `;

            // Update stats
            document.getElementById('current-round').textContent = 'FINALS';
            document.getElementById('today-matches').textContent = '3';
            document.getElementById('live-count').textContent = '1';
            document.getElementById('completed-count').textContent = '3';
        }

        function renderLiveBracket() {
            const tournament = tournamentData.tournament;
            const rounds = tournamentData.rounds || [];
            const matches = tournamentData.matches || [];
            const escapeHtml = (value) => String(value || 'TBD').replace(/[&<>'"]/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[char]));
            const matchByBracket = new Map(matches.map((match) => [match.bracket_id, match]));
            const statusLabel = (status) => ({
                scheduled: 'Ready to play', in_progress: 'Live now', completed: 'Completed', pending: 'Waiting'
            }[status] || status);
            const wrapper = document.getElementById('bracket-wrapper');

            document.getElementById('tournament-name').textContent = tournament.tournament_name || 'Tournament';
            const live = matches.filter((match) => match.status === 'in_progress').length;
            const complete = matches.filter((match) => match.status === 'completed').length;
            const nextRound = rounds.find((round) => round.matches.some((slot) => slot.status === 'scheduled' || slot.status === 'in_progress'));
            document.getElementById('current-round').textContent = nextRound ? nextRound.round_name.toUpperCase() : (tournament.status || 'Complete').toUpperCase();
            document.getElementById('today-matches').textContent = matches.length;
            document.getElementById('live-count').textContent = live;
            document.getElementById('completed-count').textContent = complete;

            wrapper.innerHTML = rounds.map((round) => `
                <div class="bracket-column">
                    <div class="bracket-title">${escapeHtml(round.round_name).toUpperCase()}</div>
                    ${round.matches.map((slot) => {
                        const match = matchByBracket.get(slot.id);
                        // A bracket slot may not have a match object yet (e.g. a
                        // future round) — render it as a neutral box instead of crashing.
                        const status = match ? match.status : slot.status;
                        const isParticipant = !!match && currentUserId && (currentUserId === match.player1_id || currentUserId === match.player2_id);
                        const isMePlayer1 = isParticipant && currentUserId === match.player1_id;
                        const opponentConnected = match ? (isMePlayer1 ? match.player2_connected : match.player1_connected) : false;
                        const activeRoll = !!match && match.roll && match.roll.status === 'rolling';
                        const canStart = !!match && status === 'scheduled' && isParticipant;
                        const canRoll = !!match && isParticipant && (status === 'scheduled' || status === 'in_progress') && !opponentConnected && !activeRoll;

                        let actionsHtml = '';
                        if (!match) {
                            actionsHtml = `<div class="match-status status-${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</div>`;
                        } else if (activeRoll) {
                            actionsHtml = `<div class="match-status status-rolling" data-roll-deadline="${escapeHtml(match.roll.deadline || '')}">🎲 Rolling... <span class="roll-countdown">10:00</span></div>`;
                        } else if (status === 'in_progress' && match.room_code) {
                            // Direct link into the multiplayer game UI
                            actionsHtml = isParticipant
                                ? `<a class="btn-bracket btn-share" href="/game/${escapeHtml(match.room_code)}">▶ Join game</a>`
                                : `<div class="match-status status-live">🔴 LIVE NOW</div>`;
                        } else if (canStart) {
                            actionsHtml = `<button class="btn-bracket btn-share" onclick="startMatch(${Number(match.id)})">Start match</button>`;
                        } else if (canRoll) {
                            actionsHtml = `<button class="btn-bracket btn-share" onclick="rollMatch(${Number(match.id)})">🎲 Roll game</button>`;
                        } else {
                            actionsHtml = `<div class="match-status status-${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</div>`;
                        }

                        const firstWinner = slot.winner_id === slot.player1_id ? ' winner' : '';
                        const secondWinner = slot.winner_id === slot.player2_id ? ' winner' : '';
                        return `<div class="match-box ${escapeHtml(status)}">
                            <div class="match-header"><span class="match-round">Match ${slot.match_number}</span><span class="match-time">${escapeHtml(statusLabel(status))}</span></div>
                            <div class="match-players">
                                <div class="player-slot${firstWinner}"><div class="player-info"><div class="player-avatar">${escapeHtml((slot.player1_name || '?').charAt(0).toUpperCase())}</div><div class="player-name">${escapeHtml(slot.player1_name)}</div></div></div>
                                <div class="player-slot${secondWinner}"><div class="player-info"><div class="player-avatar">${escapeHtml((slot.player2_name || '?').charAt(0).toUpperCase())}</div><div class="player-name">${escapeHtml(slot.player2_name)}</div></div></div>
                            </div>
                            ${actionsHtml}
                        </div>`;
                    }).join('')}
                </div>`).join('');

            renderNextMatchCallout();
        }

        function renderNextMatchCallout() {
            const panel = document.getElementById('next-match-panel');
            const detail = document.getElementById('next-match-detail');
            const actions = document.getElementById('next-match-actions');
            if (!panel || !detail || !actions) return;
            const matches = (tournamentData && tournamentData.matches) || [];

            if (!currentUserId) {
                panel.style.display = 'flex';
                detail.textContent = 'Log in to play your tournament matches.';
                actions.innerHTML = '<a class="btn-bracket btn-share" href="/login">Log in</a>';
                return;
            }

            const myMatch = matches.find(m => m.status !== 'completed' && (m.player1_id === currentUserId || m.player2_id === currentUserId));
            if (!myMatch) {
                panel.style.display = 'none';
                return;
            }

            const opponentName = myMatch.player1_id === currentUserId ? myMatch.player2_name : myMatch.player1_name;
            if (myMatch.status === 'in_progress' && myMatch.room_code) {
                panel.style.display = 'flex';
                detail.textContent = `You vs ${opponentName || 'Opponent'} — LIVE now.`;
                actions.innerHTML = `<a class="btn-bracket btn-share" href="/game/${encodeURIComponent(myMatch.room_code)}">▶ Join game</a>`;
            } else if (myMatch.status === 'scheduled') {
                panel.style.display = 'flex';
                detail.textContent = `You vs ${opponentName || 'Opponent'} — ready to play.`;
                actions.innerHTML = `<button class="btn-bracket btn-share" onclick="startMatch(${Number(myMatch.id)})">🎮 Start match</button>`;
            } else {
                panel.style.display = 'none';
            }
        }

        function startRollCountdowns() {
            const elements = document.querySelectorAll('[data-roll-deadline]');
            if (!elements.length) return;
            elements.forEach(el => {
                const target = new Date(el.dataset.rollDeadline).getTime();
                const counter = el.querySelector('.roll-countdown');
                if (!counter) return;
                const remaining = Math.max(0, Math.floor((target - Date.now()) / 1000));
                const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
                const ss = String(remaining % 60).padStart(2, '0');
                counter.textContent = `${mm}:${ss}`;
            });
        }
        setInterval(startRollCountdowns, 1000);

        function goBack() {
            window.location.href = '/tournaments';
        }

        function shareResults() {
            const text = 'Watch the epic tournament bracket on uMshova Deluxe! 🏆';
            if (navigator.share) {
                navigator.share({
                    title: 'uMshova Deluxe Tournament',
                    text: text,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                showNotification('Link copied to clipboard! 📋');
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--accent-1);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                notification.style.transition = 'all 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Initialize
        loadBracketData();

        // Polling for updates
        setInterval(() => {
            loadBracketData();
        }, 5000);
    </script>
</body>
</html>
